<!--
  SUPABASE: Reauthentication
  Subject sugerido: Código de verificação - RUNLAB
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código de verificação</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #121212; color: #e0e0e0;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #121212;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 480px;">
          <tr>
            <td style="padding-bottom: 32px; text-align: center;">
              <span style="font-size: 24px; font-weight: 700; color: #b8e00f;">RUNLAB</span>
            </td>
          </tr>
          <tr>
            <td style="background-color: #1a1a1a; border-radius: 12px; padding: 32px 24px; border: 1px solid #2a2a2a;">
              <h1 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 600; color: #f2f2f2;">
                Código de verificação
              </h1>
              <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 1.5; color: #a0a0a0;">
                Use o código abaixo para confirmar sua identidade e prosseguir com a ação solicitada.
              </p>
              <p style="margin: 0 0 24px 0; text-align: center;">
                <span style="display: inline-block; padding: 16px 32px; background-color: #b8e00f; color: #1a1a1a; font-size: 28px; font-weight: 700; letter-spacing: 6px; border-radius: 8px;">
                  {{ .Token }}
                </span>
              </p>
              <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #808080;">
                Se você não solicitou essa verificação, ignore este e-mail. O código expira em 10 minutos.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding-top: 24px; text-align: center;">
              <p style="margin: 0; font-size: 12px; color: #606060;">
                RUNLAB — Verificação de segurança
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
